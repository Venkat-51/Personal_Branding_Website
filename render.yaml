services:
  # 1. Express Backend Service
  - type: web
    name: FreelanceWithVenkat-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: BREVO_API_KEY
        sync: false

  # 2. Static Frontend Service
  - type: web
    name: FreelanceWithVenkat-frontend
    env: static
    buildCommand: ""
    staticPublishPath: ./frontend
